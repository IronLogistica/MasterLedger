[pytest]
; Il progetto non è un pacchetto installabile (nessun pyproject.toml/setup.py
; con un vero "package"): app.py, models.py, config.py ecc. stanno nella
; radice del repository. Senza questa riga, lanciando "pytest" dalla radice,
; pytest inserisce nel sys.path la cartella "tests/" (dove si trova
; conftest.py) e non la radice del progetto: "from app import create_app"
; in tests/conftest.py fallisce con "ModuleNotFoundError: No module named
; 'app'" a meno di impostare a mano PYTHONPATH=<radice repository>.
;
; "pythonpath = ." aggiunge la radice del progetto (dove si trova questo
; file) al sys.path prima della raccolta dei test, rendendo "pytest -q"
; riproducibile identico in locale e in CI senza variabili d'ambiente extra.
pythonpath = .
testpaths = tests
markers =
    postgres: richiede un PostgreSQL raggiungibile (vedi tests/test_postgresql_migrations.py); saltato in automatico se assente.
